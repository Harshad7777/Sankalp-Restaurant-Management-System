# =====================================================
# SANKALP RESTAURANT MANAGEMENT SYSTEM (RMS)
# PRODUCTION PROFILE (Render / Cloud Run / Cloud MySQL)
# =====================================================

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SankalpProdPool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: 180000
      max-lifetime: 600000
      keepalive-time: 60000
      connection-timeout: 20000

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Media Storage ('local' default for Render/VPS; set 'gcs' + GCS_BUCKET_NAME for Google Cloud Storage)
storage:
  provider: ${STORAGE_PROVIDER:local}
  gcs:
    bucket: ${GCS_BUCKET_NAME:}
    prefix: ${GCS_PREFIX:uploads/}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/rms-uploads}

# Strict CORS & Frontend URL
app:
  frontend-url: ${APP_FRONTEND_URL:https://sankalp-rms.onrender.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:*}

# Payment Gateways (Optional)
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}

stripe:
  api:
    key: ${STRIPE_API_KEY:}

paytm:
  merchant:
    id: ${PAYTM_MERCHANT_ID:}
    key: ${PAYTM_MERCHANT_KEY:}

# Disable Swagger by default in production (set SWAGGER_ENABLED=true during testing)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Spring Boot Actuator Health Checks (Render & Cloud Run Probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.restaurant: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.jdbc.core: ${LOG_LEVEL_JDBC:WARN}
    org.hibernate.orm.jdbc.bind: WARN
