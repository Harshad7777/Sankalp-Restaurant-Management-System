# =====================================================
# SANKALP RESTAURANT MANAGEMENT SYSTEM - MESSAGES BUNDLE
# SUCCESS, WARNING, AND ERROR MESSAGES
# =====================================================

# -----------------------------------------------------
# AUTHENTICATION & SECURITY
# -----------------------------------------------------
auth.success.login=Login successful. Welcome back!
auth.success.logout=Logged out successfully.
auth.error.invalid=Invalid username or password.
auth.error.unauthorized=Access denied. Please login to continue.
auth.error.forbidden=You do not have permission to perform this action.
auth.error.token.expired=Session expired. Please login again.
auth.error.token.invalid=Invalid authentication token.

# -----------------------------------------------------
# USER MANAGEMENT
# -----------------------------------------------------
user.success.created=User registered successfully.
user.success.updated=User details updated successfully.
user.success.deleted=User deleted successfully.
user.success.password.changed=Password changed successfully.
user.success.password.reset=User password has been reset successfully.
user.warning.duplicate.username=Username already exists. Please choose a different one.
user.warning.password.mismatch=New password and confirm password do not match.
user.warning.old.password.incorrect=Old password does not match current password.
user.error.notfound=User not found.
user.error.creation.failed=User creation failed. Please check inputs and try again.

