# =====================================
# Application Configuration
# =====================================
spring.application.name=RMS_springboot_jdbc_restapi

# =====================================
# Server Configuration
# =====================================
server.port=8080

# =====================================
# Database Configuration
# =====================================
# Credentials come from environment variables in every environment except
# local dev, where the fallback after ':' is used. Never commit real
# credentials here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/RMS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# JWT Configuration
# =====================================
# MUST be overridden via the JWT_SECRET env var in any non-local
# environment. Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-32bytes-min}
# 1 hour, in milliseconds
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# =====================================
# Spring SQL Initialization
# =====================================
spring.sql.init.mode=always

# =====================================
# Logging
# =====================================
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =====================================
# JSON Configuration
# =====================================
spring.jackson.serialization.indent-output=true
logging.level.root=INFO
logging.level.com.restaurant=DEBUG

logging.file.name=logs/rms.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# =====================================
# File Upload Configuration
# =====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload Directory
file.upload-dir=C:/restaurant/uploads